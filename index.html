<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System monitor vanilla</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="/assets/favicon.ico">
</head>

<template id="sensor-display-template">
  <div class="sensor-display" onclick="toggleSensorChart">
    <div class="sensor-display-head">
      <div class="__sensor-display-icon"></div>
      <div>
        <div class="sensor-display-title">
          <div class="__sensor-display-value">Unknown</div>
          <div class="__sensor-display-unit"></div>
        </div>
        <div class="sensor-display-subtitle __sensor-display-type"></div>
      </div>
    </div>
    <div class="sensor-display-body">
      <div class="sensor-display-peaks">
        <div>
          <div>Max today</div>
          <div class="__sensor-display-max-value">Unknown</div>
        </div>
        <div>
          <div>Min today</div>
          <div class="__sensor-display-min-value">Unknown</div>
        </div>
      </div>
      <canvas class="sensor-display-chart"></canvas>
    </div>
  </div>
</template>

<template id="sensor-state-display-template">
  <div class="sensor-state-display">
    <div class="sensor-display-head">
      <div class="__sensor-display-icon"></div>
      <div>
        <div class="sensor-display-title">
          <div class="__sensor-state-value">Unknown</div>
          <div></div>
        </div>
        <div class="sensor-display-subtitle __sensor-display-type"></div>
      </div>
    </div>
    <div class="sensor-display-body">
      <div class="sensor-display-peaks">
        <div>
          <div>Last state</div>
          <div class="__sensor-state-last-state">Unknown</div>
        </div>
      </div>
      <canvas class="sensor-display-chart"></canvas>
    </div>
  </div>
</template>

<template id="sensor-chart-template">
  <div class="sensor-chart __sensor-chart" id="sensor-chart-1">
    <div class='sensor-chart-head'>
      <div class='sensor-chart-title __sensor-display-type'></div>
      <div class='sensor-chart-dropdown'>

      </div>
    </div>
    <div class='sensor-chart-body'>
      <canvas class="sensor-chart-chart"></canvas>
    </div>
  </div>
</template>

<body>
  <div class='sensors-display-layout'>
    <div class='main'>
      <div class='sensors-display-grid'>
        <div id="sensor-display-slot"></div>
        <div id="el3-placeholder" style="grid-column: 3 / 5; grid-row: 1;"></div>
        <div id="sensor-chart-slot"></div>
        <div id="el5-placeholder" style="grid-column: 3 / 5; grid-row: 2 / 4;"></div>
        <div id="sensor-state-display-slot"></div>
      </div>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/render.js"></script>
  <script src="scripts/scripts.js"></script>
  <script src="libs/chart.js"></script>
  <script src="libs/fns-date-adapter.js"></script>
</body>

</html>
